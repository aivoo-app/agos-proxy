[package]
name = "agos"
version = "0.1.1"
edition = "2021"
description = "Self-hosted, CLI-managed AI gateway with OpenAI-compatible endpoints and automatic multi-provider failover"
license = "MIT"
keywords = ["ai", "gateway", "llm", "proxy", "openai"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[[bin]]
name = "agos-proxy"
path = "src/main.rs"

# Developer-only generator for man pages + shell completions + CLI markdown.
# Not installed by `cargo install`; run it explicitly when cutting a release:
#   cargo run --release --bin gen-docs
[[bin]]
name = "gen-docs"
path = "src/bin/gen-docs.rs"
required-features = ["gen-docs"]

[features]
default = []
# Marker enabling the standalone gen-docs binary. The doc tooling itself is a
# first-class `gen-docs` subcommand of the main binary, so the supporting crates
# are always compiled; this feature only gates the extra developer-only binary.
gen-docs = []

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.8"
hex = "0.4.3"
thiserror = "2.0.12"
serde_json = "1.0.151"
chacha20poly1305 = "0.10.1"
aead = "0.5.2"
argon2 = "0.5.3"
rand = "0.8.5"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
clap-markdown = "0.1.5"
futures = "0.3.31"
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap_mangen = { version = "0.3.3" }
clap_complete = { version = "4.6.9" }
ratatui = "0.29"
crossterm = "0.28"
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "trace", "compression-gzip", "timeout"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5.3"

[profile.release]
lto = true
strip = true
