[package]
name = "agos"
version = "0.1.0"
edition = "2021"
description = "Self-hosted, CLI-managed AI gateway with OpenAI-compatible endpoints and automatic multi-provider failover"
license = "MIT"
keywords = ["ai", "gateway", "llm", "proxy", "openai"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
getrandom = "0.4.3"
reqwest = "0.13.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-stream = "0.1.19"
tracing = "0.1.44"

[profile.release]
lto = true
strip = true
