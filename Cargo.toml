[package]
name = "agos"
version = "0.1.0"
edition = "2021"
description = "Self-hosted, CLI-managed AI gateway with OpenAI-compatible endpoints and automatic multi-provider failover"
license = "MIT"
keywords = ["ai", "gateway", "llm", "proxy", "openai"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.8"
hex = "0.4.3"
serde_json = "1.0.151"
chacha20poly1305 = "0.10.1"
aead = "0.5.2"
argon2 = "0.5.3"
rand = "0.8.5"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"

[dev-dependencies]
tower = "0.5.3"

[profile.release]
lto = true
strip = true
