# Egress mask — nginx on any VPS (recommended backend: you control the IP/ASN).
#
# ~$0-6/month, unlimited streaming, no payload caps, static egress IP.
# Deploy one per key, on different providers/regions for distinct ASNs.
#
#   sudo apt install nginx && cp nginx.conf /etc/nginx/sites-available/mask
#   ln -s /etc/nginx/sites-available/mask /etc/nginx/sites-enabled/
#   # put the secret in /etc/nginx/mask_secret (chmod 600, no trailing newline)
#   nginx -t && systemctl reload nginx
#
#   agos-proxy mask add --name hop1 --kind nginx \
#     --endpoint-url https://<vps-host> --secret "$SECRET" --expected-egress-ip <vps-ip>
#
# Requires nginx with http_sub or just proxy pass; any 1.x works.

# Rate-limit the probe/health endpoint a little (brute-force protection).
limit_req_zone $binary_remote_addr zone=mask_probe:10m rate=5r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name mask1.example.com;        # your hostname; use certbot for TLS

    ssl_certificate     /etc/letsencrypt/live/mask1.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mask1.example.com/privkey.pem;

    # Read the shared secret at request time.
    set $mask_secret "";

    # Allowlist: default-deny. Every location below checks the secret.
    location = /probe {
        limit_req zone=mask_probe burst=3 nodelay;
        if ($http_x_forward_mask != "$MASK_SECRET") { return 403; }
        if ($http_x_forward_probe != "ip") { return 403; }
        default_type application/json;
        # Egress identity: requires the ip_echo patch OR a local upstream
        # that reports the server's IP. Simplest reliable approach:
        return 200 '{"ip":"SERVER_IP","asn":"AS00000 Your-Provider","country":"XX"}';
    }

    location / {
        if ($http_x_forward_mask != "$MASK_SECRET") { return 403; }

        # Absolute upstream URL comes in X-forward-target.
        proxy_pass $http_x_forward_target;

        # Stream SSE/completions unbuffered, with generous timeouts.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Strip hop headers so the upstream sees a clean request. The
        # x-forwarded-* family is critical: forwarding the client's
        # X-Forwarded-For would reveal the AGOS host's real IP.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-forward-mask "";
        proxy_set_header X-forward-target "";
        proxy_set_header X-forward-probe "";
        proxy_set_header X-forwarded-for "";
        proxy_set_header X-forwarded-host "";
        proxy_set_header X-forwarded-proto "";
        proxy_set_header X-real-ip "";
    }
}
