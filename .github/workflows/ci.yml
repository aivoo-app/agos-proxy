name: CI
'on':
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the job cache across runs without a dedicated cache action. This is a
  # lightweight setup; swap to `Swatinem/rust-cache` if cache size becomes an
  # issue.
  CARGO_HOME: ${{ github.workspace }}/.cargo
  RUSTUP_HOME: ${{ github.workspace }}/.rustup

jobs:
  check:
    name: Check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets -- --test-threads=auto

      - name: Release build
        run: cargo build --release

      - name: Docs generation smoke test
        run: ./target/release/agos-proxy gen-docs --all --output-dir ./ci-docs

      - name: Upload generated docs (for inspection on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: ci-docs/
          retention-days: 5

  docker-compose:
    name: Docker compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for proxy to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ready >/dev/null 2>&1; then
              echo 'proxy ready'
              exit 0
            fi
            sleep 1
          done
          echo 'proxy did not become ready in time' >&2
          docker compose logs proxy || true
          exit 1

      - name: Basic smoke request
        run: |
          curl -sf -H 'Content-Type: application/json' \
            http://localhost:8080/v1/models \
            -H 'Authorization: Bearer sk-mock' \
            | jq -e '.object == "list"' \
            || (echo 'v1/models did not return the expected shape' && docker compose logs proxy && exit 1)

      - name: Chat completions smoke request
        run: |
          curl -sf -H 'Content-Type: application/json' \
            http://localhost:8080/v1/chat/completions \
            -H 'Authorization: Bearer sk-mock' \
            -d '{"model":"main/chat","messages":[{"role":"user","content":"hi"}]}' \
            | jq -e '.choices | length > 0' \
            || (echo 'chat completion failed' && docker compose logs proxy && exit 1)

      - name: Streaming smoke request
        run: |
          curl -sf -N -H 'Content-Type: application/json' \
            http://localhost:8080/v1/chat/completions \
            -H 'Authorization: Bearer sk-mock' \
            -d '{"model":"main/chat","messages":[{"role":"user","content":"hi"}],"stream":true}' \
            | grep -q 'chat.completion.chunk' \
            || (echo 'streaming response missing SSE chunks' && docker compose logs proxy && exit 1)

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans || true
