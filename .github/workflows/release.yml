name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Generate docs (man pages, completions, CLI reference)
        run: cargo run --release --locked --features gen-docs --bin gen-docs
      - name: Stage release bundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="agos-proxy-${TAG}-${{ matrix.target }}"
          mkdir -p "$STAGE/completions"
          cp "target/${{ matrix.target }}/release/agos-proxy" "$STAGE/"
          cp target/docs/man/agos-proxy*.1 "$STAGE/"
          cp target/docs/completions/* "$STAGE/completions/"
          cp docs/CLI.md "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: ${{ env.STAGE }}.tar.gz
  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/*/*.tar.gz
          generate_release_notes: true